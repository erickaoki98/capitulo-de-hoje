name: Security secrets
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every new commit
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/check_secrets.py --event
      - name: Audit all history manually
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_secrets.py --all-history
